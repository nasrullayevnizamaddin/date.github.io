<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mənimlə görüşə gedərsən?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd6e0; --bg2:#ffb3c6; --card:rgba(255,255,255,.72); --ink:#5a1f3a;
  --accent:#ff3d77; --accent2:#ff7aa2; --soft:#fff0f4; --line:#ffc2d4; --cat:#ffcf8a; --catd:#f5a85a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a1228;--bg2:#5c1b3d;--card:rgba(40,10,28,.72);--ink:#ffe3ec;--soft:#4d1834;--line:#8a3a5e;}
}
:root[data-theme="dark"]{--bg1:#3a1228;--bg2:#5c1b3d;--card:rgba(40,10,28,.72);--ink:#ffe3ec;--soft:#4d1834;--line:#8a3a5e;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg2);display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.card{position:relative;z-index:1;width:100%;max-width:520px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid var(--line);border-radius:32px;padding:34px 24px;text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.screen{display:none;width:100%;flex-direction:column;align-items:center;gap:20px}
.screen.on{display:flex;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
h1{font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.15;font-weight:700}
p.sub{font-size:1.05rem;opacity:.85}
.btn{font-family:inherit;font-weight:600;font-size:1.25rem;border:none;border-radius:999px;padding:14px 34px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(255,61,119,.4);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;animation:none}
.btn.pulse{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}45%{transform:scale(1.07)}}
.btn.pulse::after,#yes::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes shine{to{left:140%}}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:90px;width:100%}
#yes{font-size:1.6rem;padding:16px 46px;transition:transform .2s}
#no{font-family:inherit;font-weight:500;font-size:1.15rem;border:2px solid var(--line);border-radius:999px;padding:12px 28px;background:var(--soft);color:var(--ink);cursor:pointer;animation:wob 2.2s ease-in-out infinite;transition:left .14s ease-out,top .14s ease-out}
@keyframes wob{0%,100%{rotate:-4deg}50%{rotate:4deg}}
/* cat */
.cat{width:min(260px,70vw);height:auto;animation:bounce 1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bounce{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-14px) scaleY(1.04)}}
.tail{transform-origin:196px 188px;animation:tail .7s ease-in-out infinite alternate}
@keyframes tail{from{rotate:-14deg}to{rotate:16deg}}
.paw{transform-origin:70px 170px;animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{rotate:-18deg}to{rotate:14deg}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 3.4s infinite}
@keyframes blink{0%,92%,100%{scale:1}96%{scale:1 .1}}
.floaty{animation:fl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{translate:0 0;scale:1}50%{translate:0 -8px;scale:1.2}}
.gif{max-width:100%;border-radius:20px;display:none}
/* form */
.field{width:100%;text-align:left;font-weight:500}
.field label{display:block;margin-bottom:6px}
input[type=date],input[type=time]{width:100%;font-family:inherit;font-size:1.15rem;padding:13px 16px;border:2px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);outline:none}
input:focus-visible,.btn:focus-visible,.chip:focus-visible,.big:focus-visible,#no:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.big{width:100%;font-family:inherit;font-size:1.3rem;font-weight:600;padding:18px;border-radius:22px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;transition:.2s}
.big:hover{transform:translateY(-2px);border-color:var(--accent)}
.big.done{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.menu{display:none;width:100%;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:-6px}
.menu.open{display:flex;animation:pop .35s ease}
.chip{font-family:inherit;font-size:1rem;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{transform:scale(1.06)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pick{font-size:.95rem;opacity:.9;min-height:1.2em}
.when{font-size:1.15rem;font-weight:600;background:var(--soft);border:2px dashed var(--accent);border-radius:18px;padding:12px 18px}
.final h1 span{display:block;color:var(--accent);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="card">

  <section class="screen on" id="s1">
    <h1>Mənimlə görüşə gedərsən? 💘</h1>
    <div class="row" id="row">
      <button class="btn" id="yes">BƏLİ! 💖</button>
      <button id="no">Xeyr</button>
    </div>
  </section>

  <section class="screen" id="s2">
    <h1>Yaşasın! 🎉</h1>
    <div class="catslot"></div>
    <button class="btn pulse" data-next="s3">bura bas</button>
  </section>

  <section class="screen" id="s3">
    <h1>Nə vaxt görüşək?</h1>
    <div class="field"><label for="d">Tarix</label><input type="date" id="d"></div>
    <div class="field"><label for="t">Vaxt</label><input type="time" id="t"></div>
    <button class="btn pulse" id="b3" data-next="s4" disabled>bura bas</button>
  </section>

  <section class="screen" id="s4">
    <h1>Nə edək?</h1>
    <button class="big" id="foodBtn">🍽️ Yemək</button>
    <div class="menu" id="foodMenu"></div>
    <button class="big" id="funBtn">🎡 Əyləncə</button>
    <div class="menu" id="funMenu"></div>
    <div class="pick" id="pick"></div>
    <button class="btn pulse" id="b4" data-next="s5" disabled>bura bas</button>
  </section>

  <section class="screen" id="s5">
    <h1>Görüşümüzü səbirsizliklə gözləyirəm 🥰</h1>
    <div class="catslot"></div>
    <button class="btn pulse" data-next="s6">bura bas</button>
  </section>

  <section class="screen final" id="s6">
    <h1>Görüşərik<span id="when"></span></h1>
    <div class="catslot"></div>
    <div class="pick" id="summary"></div>
  </section>

</main>

<script>
// Свои гифки: вставь ссылки на файлы (для s2, s5, s6). Пусто — показывается анимированный котик.
const GIFS = { s2:"", s5:"", s6:"" };

const FOOD = ["🍔 Burqerlər","🥩 Steyk","🍕 Pizza","🍣 Suşi","🍝 Makaron","🍰 Desertlər","🌮 Tako","🍜 Ramen"];
const FUN  = ["🏎️ Karting","🎳 Boulinq","🎬 Kino","⛸️ Konki","🎯 Atıcılıq","🐎 At sürmə","🏛️ Muzey","🧗 Qayaya dırmanma"];
const $ = id => document.getElementById(id);
let food = "", fun = "";

const catSVG = `<svg class="cat" viewBox="0 0 240 240" role="img" aria-label="Şən pişik">
  <g class="tail"><path d="M190 190 C240 190 235 120 205 125" fill="none" stroke="#f5a85a" stroke-width="16" stroke-linecap="round"/></g>
  <ellipse cx="120" cy="190" rx="62" ry="42" fill="#ffcf8a"/>
  <g class="paw"><ellipse cx="62" cy="168" rx="14" ry="26" fill="#ffcf8a" transform="rotate(20 62 168)"/></g>
  <ellipse cx="160" cy="224" rx="18" ry="10" fill="#f5a85a"/><ellipse cx="86" cy="224" rx="18" ry="10" fill="#f5a85a"/>
  <path d="M58 92 L64 40 L98 70 Z" fill="#ffcf8a"/><path d="M182 92 L176 40 L142 70 Z" fill="#ffcf8a"/>
  <path d="M68 78 L70 54 L88 70 Z" fill="#ff9db5"/><path d="M172 78 L170 54 L152 70 Z" fill="#ff9db5"/>
  <ellipse cx="120" cy="108" rx="68" ry="58" fill="#ffcf8a"/>
  <path d="M120 52 v14 M104 55 v10 M136 55 v10" stroke="#f5a85a" stroke-width="5" stroke-linecap="round"/>
  <g class="eye"><path d="M82 108 q14 -20 28 0" fill="none" stroke="#5a1f3a" stroke-width="6" stroke-linecap="round"/></g>
  <g class="eye"><path d="M130 108 q14 -20 28 0" fill="none" stroke="#5a1f3a" stroke-width="6" stroke-linecap="round"/></g>
  <ellipse cx="78" cy="128" rx="12" ry="8" fill="#ff8fab" opacity=".7"/><ellipse cx="162" cy="128" rx="12" ry="8" fill="#ff8fab" opacity=".7"/>
  <path d="M114 124 h12 l-6 8 z" fill="#ff5c8a"/>
  <path d="M120 132 v6 M120 138 q-12 14 -26 0 M120 138 q12 14 26 0" fill="none" stroke="#5a1f3a" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 120 h-30 M60 130 l-28 8 M180 120 h30 M180 130 l28 8" stroke="#5a1f3a" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <text class="floaty" x="196" y="52" font-size="30">💖</text><text class="floaty" x="22" y="64" font-size="22" style="animation-delay:.5s">💕</text>
</svg>`;

document.querySelectorAll('.catslot').forEach(slot=>{
  const id = slot.parentElement.id, url = GIFS[id];
  slot.innerHTML = catSVG + (url ? `<img class="gif" src="${url}" alt="">` : "");
  if(url){ const img = slot.querySelector('img'); img.onload=()=>{slot.querySelector('svg').style.display='none';img.style.display='block'}; }
});

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
}
document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.next==='s6') fillFinal();
  show(b.dataset.next);
}));

/* убегающая кнопка */
const no = $('no'), yes = $('yes');
let scale = 1, fled = false, px = -999, py = -999;
function flee(e){
  if(e && e.cancelable) e.preventDefault();
  if(!fled){ fled = true; document.body.appendChild(no); no.style.position='fixed'; no.style.zIndex='9999'; no.style.margin='0'; }
  const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
  const yr = yes.getBoundingClientRect();
  let x, y, tries = 0;
  do{
    x = pad + Math.random()*(innerWidth - w - pad*2);
    y = pad + Math.random()*(innerHeight - h - pad*2);
    tries++;
  } while(tries<40 && (Math.hypot(x+w/2-px,y+h/2-py)<260 || (x < yr.right+10 && x+w > yr.left-10 && y < yr.bottom+10 && y+h > yr.top-10)));
  no.style.left = x+'px'; no.style.top = y+'px';
  scale = Math.min(scale + .07, 1.5);
  yes.style.transform = `scale(${scale})`;
}
['mouseenter','pointerdown','touchstart','click','focus'].forEach(ev=>no.addEventListener(ev,flee,{passive:false}));
function near(x,y){ px=x; py=y; if(no.style.display==='none') return; const r=no.getBoundingClientRect(), m=130; if(x>r.left-m && x<r.right+m && y>r.top-m && y<r.bottom+m) flee(); }
addEventListener('pointermove',e=>near(e.clientX,e.clientY));
addEventListener('touchstart',e=>{const q=e.touches[0]; near(q.clientX,q.clientY);},{passive:true});
yes.addEventListener('click',()=>{ no.style.display='none'; yes.style.transform=''; burst(); show('s2'); });

/* дата/время */
const d = $('d'), t = $('t');
d.min = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function check3(){ $('b3').disabled = !(d.value && t.value); }
d.addEventListener('input',check3); t.addEventListener('input',check3);

/* меню */
function build(menuId, items, setter, btnId){
  const m = $(menuId);
  items.forEach(txt=>{
    const c = document.createElement('button'); c.className='chip'; c.textContent=txt;
    c.onclick=()=>{ m.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); setter(txt); $(btnId).classList.add('done'); updatePick(); };
    m.appendChild(c);
  });
}
build('foodMenu',FOOD,v=>food=v,'foodBtn');
build('funMenu',FUN,v=>fun=v,'funBtn');
$('foodBtn').onclick=()=>{ $('foodMenu').classList.toggle('open'); $('funMenu').classList.remove('open'); };
$('funBtn').onclick =()=>{ $('funMenu').classList.toggle('open'); $('foodMenu').classList.remove('open'); };
function updatePick(){
  $('pick').textContent = [food,fun].filter(Boolean).join('  +  ');
  $('b4').disabled = !(food && fun);
}

/* финал */
function fillFinal(){
  const dt = new Date(d.value+'T'+t.value);
  const ds = dt.toLocaleDateString('az-AZ',{weekday:'long',day:'numeric',month:'long'});
  $('when').textContent = `${ds}, saat ${t.value} 💞`;
  $('summary').textContent = `${food} · ${fun}`;
}

/* сердечки */
const hs = $('hearts');
function heart(){
  const s = document.createElement('span');
  s.textContent = ['💗','💖','💕','🌸'][Math.floor(Math.random()*4)];
  s.style.left = Math.random()*100+'%';
  s.style.fontSize = 14+Math.random()*22+'px';
  s.style.animationDuration = 7+Math.random()*7+'s';
  hs.appendChild(s); setTimeout(()=>s.remove(),15000);
}
for(let i=0;i<10;i++) setTimeout(heart,i*500);
setInterval(heart,900);
function burst(){ for(let i=0;i<18;i++) setTimeout(heart,i*40); }
</script>
</body>
</html>
